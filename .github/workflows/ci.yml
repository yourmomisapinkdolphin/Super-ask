name: CI

# Every check that used to depend on someone remembering to run it.
#
# Runs with NO provider credential configured. That is deliberate: generation
# falls back to the deterministic extractive provider, so nothing here makes a
# paid model call, and a fork's pull request cannot spend the gateway credit.
# What is measured — retrieval, refusal, the guardrail policy, corpus integrity
# — does not involve the model at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Pin the governance-relevant switches rather than inheriting a default
      # that could drift. FR-72/73: the answer trace is never on in CI.
      DIAGNOSTICS_ENABLED: "false"
      GENERAL_FALLBACK_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Coverage thresholds are a floor set in vitest.config.ts, so deleting a
      # suite fails here rather than showing up as a sinking percentage.
      - name: Unit and integration tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The measured metrics from PRD section 4. These fail the build on a
      # regression in recall or refusal, which is the point — M-03 and M-04 are
      # targets, not observations.
      - name: Retrieval and refusal evaluation (M-03, M-04)
        run: npm run eval

      - name: Verification gate check (FR-15)
        run: npm run verify-check

      - name: Curated answer check (FR-10, FR-11)
        run: npm run curated-check

      - name: Scope gate check
        run: npm run scope-check

      - name: Rationale gate check
        run: npm run rationale-check

  secrets-scan:
    # R-15 / FR-74: the provider credential must never reach the repository.
    # .gitignore covers .env.local, but a check that depends on a file being
    # correct is not a check.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on a committed credential
        run: |
          # Exclude tests/: fixtures deliberately use fake key-shaped strings to
          # assert they never leak into responses (FR-74). Real credentials must
          # not appear anywhere else in the tree.
          if git grep -nIE '(sk-ant-|sk-nous-|sk-proj-)[A-Za-z0-9_-]{12,}' -- . \
            ':!.github/workflows/ci.yml' ':!tests/**'; then
            echo "::error::A provider credential appears to be committed (R-15 / FR-74)."
            exit 1
          fi
          echo "No credential patterns found."

      - name: Fail if an env file is tracked
        run: |
          if git ls-files --error-unmatch .env .env.local 2>/dev/null; then
            echo "::error::An environment file is tracked by git."
            exit 1
          fi
          echo "No tracked env files."

  deploy:
    # Production deploy to Vercel. Only a push to main, and only after every
    # check above has passed, so a regression in recall, refusal or the
    # verification gate never reaches citizens. Pull requests never deploy and
    # never see the token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, secrets-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A newer push to main must not cancel a deploy halfway through an upload.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Skip if Vercel secrets are not configured
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set. Skipping deploy."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        # 65.x or later: older CLIs reject the project's Node.js 26.x setting.
        run: npm install --global vercel@65.11.0

      # Production env vars (provider credential, Telegram token) stay in
      # Vercel. They are pulled into the runner for the build only and are
      # never written to the repository.
      - name: Pull Vercel production settings
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # The Hobby team rejects deploys whose git commit author is not a team
      # member (see README, "Issues encountered"). Upload the prebuilt output
      # without git metadata, as the manual deploys did. The runner is
      # discarded after the job, so removing .git here touches nothing else.
      - name: Deploy to production
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          rm -rf .git
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
